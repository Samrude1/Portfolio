name: Keep AI Projects Awake
# Last updated: 2026-04-29

on:
  schedule:
    # Ajetaan 50 minuutin välein (pysyy alle tunnin rajan)
    - cron: '*/50 * * * *'
  workflow_dispatch: # Mahdollistaa manuaalisen ajon testausta varten

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel & Hugging Face Spaces
        run: |
          urls=(
            "https://samirautanen.fi"
            "https://agent-squad-sigma.vercel.app"
            "https://huggingface.co/spaces/samrude1/Sidekick"
            "https://huggingface.co/spaces/samrude1/EngineeringTeam"
            # Agent Squad backend & UI
            "https://huggingface.co/spaces/samrude1/Agent-team"
            "https://huggingface.co/spaces/samrude1/careerbot"
            "https://samrude1-sidekick.hf.space"
            "https://samrude1-engineeringteam.hf.space"
            # Agent Squad direct API
            "https://samrude1-agent-team.hf.space"
            "https://samrude1-careerbot.hf.space"
            # Portfolio & AWS Showcase
            "https://ai-bot-backend-dx68.onrender.com/health"
            "https://d6x3ucjiv33it.cloudfront.net/"
          )
          
          for url in "${urls[@]}"; do
            echo "Pinging $url..."
            curl -sL --connect-timeout 10 --max-time 20 "$url" > /dev/null
            if [ $? -eq 0 ]; then
              echo "✅ Success"
            else
              echo "❌ Failed"
            fi
          done
